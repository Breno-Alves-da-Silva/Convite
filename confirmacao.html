<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontro Confirmado!</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="painel-central">
        <img src="https://media1.tenor.com/m/jKeEsyBbz6IAAAAC/turtle-love.gif" alt="Ursinhos felizes" class="ursinho">
        <h2>Então temos um encontro, Yasmin! ❤️</h2>
        
        <div class="detalhes-encontro">
            <p>📅 <strong>Data:</strong> <span id="resumoDia">Carregando...</span></p>
            <p>⏰ <strong>Horário:</strong> <span id="resumoHora">Carregando...</span></p>
            <p>💖 <strong>Encontro:</strong> <span id="resumoLocal">Carregando...</span></p>
        </div>

        <div class="caixa-timer">
            <p class="titulo-timer">⏳ Faltam para o nosso encontro:</p>
            <div id="contador" class="contador">Calculando...</div>
        </div>
        
        <p class="mensagem-final">Mal posso esperar! Já reservei a data para nós. ❤️</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
