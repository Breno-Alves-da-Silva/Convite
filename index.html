<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="painel-central" id="tela1">
        <img src="https://media1.tenor.com/m/jKeEsyBbz6IAAAAC/turtle-love.gif" alt="Ursinho fofo" class="ursinho">
        <h2>Você aceita sair para um encontro comigo?</h2>
        <p class="mensagem-erro">Acho que você clicou errado...</p>

        <div class="botoes">
            <button id="btnSim" class="btn-sim">SIM</button>
            <button id="btnNo" class="btn-nao">NÃO</button>
        </div>
    </div>

    <div class="painel-central" id="tela2" style="display: none;">
        <img src="https://media1.tenor.com/m/jKeEsyBbz6IAAAAC/turtle-love.gif" alt="Ursinho pensando" class="ursinho">
        <h2>Qual o melhor dia e horário para você? 🥰</h2>

        <div class="formulario-encontro">
            <label for="dia">Escolha o dia:</label>
            <select id="dia" class="campo-selecao">
                <option value="sabado">Sábado</option>
                <option value="domingo">Domingo</option>
            </select>

            <label for="hora">Escolha o horário:</label>
            <input type="time" id="hora" class="campo-selecao" value="20:00">

            <button id="btnConfirmar" class="btn-confirmar">CONFIRMAR ENCONTRO</button>
        </div>
    </div>

    <div class="painel-central" id="tela3" style="display: none;">
        <img src="https://media1.tenor.com/m/jKeEsyBbz6IAAAAC/turtle-love.gif" alt="Ursinhos felizes" class="ursinho">
        <h2>Eba! Encontro confirmado! 😍</h2>
        
        <div class="detalhes-encontro">
            <p>📅 <strong>Data:</strong> <span id="resumoDia">Sábado</span></p>
            <p>⏰ <strong>Horário:</strong> <span id="resumoHora">20:00</span></p>
            <p>📍 <strong>Local:</strong> Lugar secreto</p>
        </div>
        
        <p class="mensagem-final">Mal posso esperar! Já reservei a data para nós. ❤️</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
